<body class="bg-white text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between gap-2">
      <a href="/" class="flex items-center gap-2 font-display font-extrabold text-base sm:text-lg text-graphite whitespace-nowrap">

      <div class="flex items-center gap-2">

        <button type="button" class="js-theme-toggle grid place-items-center w-10 h-10 rounded-lg border border-slate-200 text-graphite hover:text-fire-600 hover:border-fire-500" aria-label="Перемкнути темну тему" title="Темна / світла тема">

  <main class="flex-1">
    <section class="py-10 md:py-16">

          <span class="text-graphite font-medium">Каталог</span>
        </nav>
        <h1 class="mt-3 font-display font-extrabold text-3xl sm:text-4xl md:text-5xl text-graphite">Каталог товарів</h1>
        <p class="mt-3 text-slate-500 max-w-2xl">Тепло і затишок для вашого дому. Доставка Новою Поштою 1–3 дні, оплата при отриманні.</p>

        <div id="catalogGrid" class="mt-8 md:mt-10 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-6"></div>
        <p id="catalogEmpty" class="hidden mt-10 text-center text-slate-500">Товари скоро зʼявляться.</p>
      </div>
    </section>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-10 text-sm">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

      </div>
      <a href="tel:+380990227684" class="inline-flex items-center gap-2 text-white text-base font-semibold hover:text-fire-500"><i data-lucide="phone" class="w-4 h-4 text-fire-500"></i>+38 (099) 022-76-84</a>
    </div>
    <p class="max-w-6xl mx-auto px-4 mt-6 pt-6 border-t border-white/10 text-xs">© 2026 WarmHome UA. Усі права захищені.</p>
  </footer>

  <script>
    (function () {
      const n = window.renderProducts ? renderProducts(document.getElementById('catalogGrid')) : 0;
      if (!n) document.getElementById('catalogEmpty').classList.remove('hidden');

      function setTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? '#0B1220' : '#EA580C';
      }
      if (document.documentElement.classList.contains('dark')) setTheme(true);
      document.querySelectorAll('.js-theme-toggle').forEach(b => b.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark'))));

      window.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());
    })();
  </script>
